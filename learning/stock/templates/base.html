{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список акций</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
  </head>
  <body>
    <main>
      <!-- Верхняя панель -->
      <div class="py-3 bg-light border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
          <div>
            {% if user.is_authenticated %}
              <span class="me-2">Добро пожаловать, <strong>{{ user.username }}</strong></span>
              <a class="btn btn-sm btn-outline-primary me-2" href="{% url 'stock:account' %}">Личный кабинет</a>
              <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger">Выход</button>
              </form>
            {% else %}
              <a class="btn btn-sm btn-primary" href="{% url 'login' %}">Вход</a>
            {% endif %}
          </div>
        </div>
      </div>

      <!-- Основной контент -->
      <div class="py-5">
        <div class="container">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
